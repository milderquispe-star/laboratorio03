<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Exploración Espacial</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0b1026; color: white; margin: 0;">

    <nav style="background-color: #171d3d; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none;">Sobre nosotros</a>
        <a href="contact.html" style="color: #66ccff; margin: 0 15px; text-decoration: none;">Contacto</a>
    </nav>

    <main style="max-width: 600px; margin: 50px auto; padding: 20px;">
        <h1 style="color: #66ccff;">Contacto</h1>

        <p>¿Tienes alguna pregunta sobre el espacio? Escríbenos.</p>

        <form style="background-color: #171d3d; padding: 25px; border-radius: 10px;">
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"
                   style="width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box;">

            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email"
                   style="width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box;">

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5"
                      style="width: 100%; padding: 10px; margin: 8px 0 15px; box-sizing: border-box;"></textarea>

            <button type="submit"
                    style="background-color: #66ccff; color: #0b1026; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px;">
                Enviar
            </button>
        </form>
    </main>

</body>
</html>
